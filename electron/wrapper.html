<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTrack Website Copier</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; font: 14px "Segoe UI", Verdana, sans-serif; }
    .row { display: flex; height: 100%; }
    .col { display: flex; flex-direction: column; min-width: 0; }
    .col-hts { flex: 0 0 52%; border-right: 2px solid #333; }
    .col-browser { flex: 1; background: #f0f0f0; }
    .col-hts iframe,
    .col-browser iframe { flex: 1; width: 100%; border: none; display: block; }
    .browser-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #ddd;
      border-bottom: 1px solid #999;
    }
    .browser-bar label { flex: 0 0 auto; }
    .browser-bar input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #999;
      border-radius: 4px;
    }
    .browser-bar input[type="text"]:focus { outline: none; border-color: #07c; }
    .browser-bar button {
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      background: #07c;
      color: #fff;
      border: none;
      border-radius: 4px;
    }
    .browser-bar button:hover { background: #06b; }
    .browser-bar button:active { background: #059; }
  </style>
</head>
<body>
  <div class="row">
    <div class="col col-hts">
      <iframe id="hts-frame" title="HTTrack UI"></iframe>
    </div>
    <div class="col col-browser">
      <div class="browser-bar">
        <label for="url-in">URL</label>
        <input type="text" id="url-in" placeholder="https://example.com" spellcheck="false" />
        <button type="button" id="go-btn">Go</button>
      </div>
      <iframe id="browser-frame" title="Web browser" src="about:blank"></iframe>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var server = params.get('server') || 'http://127.0.0.1:8080';
      document.getElementById('hts-frame').src = server;

      var urlIn = document.getElementById('url-in');
      var browserFrame = document.getElementById('browser-frame');
      var goBtn = document.getElementById('go-btn');

      function normalizeUrl(raw) {
        var s = (raw || '').trim();
        if (!s) return '';
        if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) s = 'https://' + s;
        return s;
      }

      function go() {
        var url = normalizeUrl(urlIn.value);
        if (url) browserFrame.src = url;
      }

      goBtn.addEventListener('click', go);
      urlIn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); go(); }
      });
    })();
  </script>
</body>
</html>
